<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#2f81f7"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#101b2c"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </radialGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <clipPath id="textclip">
      <text x="600" y="172" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900">R1K4</text>
    </clipPath>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect x="6" y="6" width="1188" height="328" rx="18" fill="none" stroke="#1f6feb" stroke-opacity="0.4" stroke-width="2"/>

  <circle cx="150" cy="90" r="4" fill="#2f81f7" opacity="0.6">
    <animate attributeName="cy" values="90;70;90" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1040" cy="120" r="5" fill="#a371f7" opacity="0.5">
    <animate attributeName="cy" values="120;95;120" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="950" cy="260" r="3" fill="#22d3ee" opacity="0.6">
    <animate attributeName="cy" values="260;240;260" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="230" cy="250" r="3" fill="#2f81f7" opacity="0.5">
    <animate attributeName="cy" values="250;268;250" dur="4.5s" repeatCount="indefinite"/>
  </circle>

  <text x="604" y="182" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900" fill="#020617">R1K4</text>
  <text x="603" y="179" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900" fill="#041e3a">R1K4</text>
  <text x="602" y="176" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900" fill="#0a2f57">R1K4</text>

  <text x="600" y="172" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900" fill="#2f81f7" filter="url(#blur)" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.75;0.3" dur="2.6s" repeatCount="indefinite"/>
  </text>

  <text x="600" y="172" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900" fill="url(#grad)">R1K4</text>

  <g clip-path="url(#textclip)">
    <rect x="-350" y="0" width="260" height="340" fill="url(#shine)" transform="rotate(18)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="1900 0" dur="3s" repeatCount="indefinite" additive="sum"/>
    </rect>
  </g>

  <rect x="350" y="212" width="500" height="4" rx="2" fill="url(#grad)">
    <animate attributeName="width" values="0;500" dur="1.4s" fill="freeze"/>
    <animate attributeName="x" values="600;350" dur="1.4s" fill="freeze"/>
  </rect>

  <text x="600" y="268" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" letter-spacing="10" fill="#dbe7f3">FB USER HANDER</text>
  <text x="600" y="306" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" letter-spacing="2" fill="#5b7186">USERNAME TO UID &#8226; PROFILE PICTURE &#8226; TELEGRAM BOT</text>
</svg>
